<!doctype html>
<html lang="zh-CN">
<head>

<title>滑雪装备小帮手 · SkiDeals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>❄</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="logo" href="#/">❄ 滑雪装备小帮手 <span>SkiDeals</span></a>
  <div class="search">
    <input id="q" type="search" placeholder="搜索品牌或型号：Bent 100、Sabre、I/O MAG…" autocomplete="off">
  </div>
  <nav class="nav">
    <a href="#/" data-nav="deals">找折扣</a>

  </nav>
  <div class="update">

</header>

<main id="app"><div class="loading">加载中…</div></main>

<div id="drawer" class="drawer hidden" aria-hidden="true">

  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <button class="drawer-x" data-close aria-label="关闭">✕</button>
    <div id="drawer-body"></div>
  </aside>
</div>
<div id="crawl-pop" class="crawl-pop hidden"></div>
<div id="toast" class="toast hidden"></div>
