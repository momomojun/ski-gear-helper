# ============================================================================
# 零售商注册表 —— 只有这里列出、并经过核验的网站才会被抓取价格。
#
# tier（可信等级，人工核验后填写）：
#   A     = 大型 / 老牌零售商（多年经营、有实体店、口碑良好）
#   B     = 正规的专业雪具店（有实体店或多年经营）
#   brand = 品牌官方网店（价格通常是官方原价，可作为“原价参考”）
# 自动核验结果（域名注册年限、网站历史、联系方式等）在网页的「网站可信度」页查看，
# 运行 `python -m skideals check-retailers` 会重新核验全部网站。
#
# adapter：用哪个抓取器。shopify = 通用 Shopify 抓取器（配置 collections 即可）；
#          其他值对应 skideals/adapters/ 下的专用抓取器。
# 新增网站前，请先在网页「网站可信度」里检测一下，确认可信再加进来。
# ============================================================================

# ---------------------------------------------------------------- 美国 · 综合雪具零售商

[[retailers]]
id = "evo"
name = "evo"
country = "US"
currency = "USD"
url = "https://www.evo.com"
adapter = "shopify"
tier = "A"
price_match = "比其他美国授权零售商的最终价再低 5%（30 天内），自家降价也补差价"
collections = ["mens-skis", "womens-skis", "kids-skis"]
[retailers.hints]
"mens-skis" = { gender = "men" }
"womens-skis" = { gender = "women" }
"kids-skis" = { gender = "kids" }
"all-mountain-skis" = { type = "all-mountain" }
"powder-skis" = { type = "powder" }
"carving-skis" = { type = "carving" }
"alpine-touring-skis" = { type = "touring" }

[[retailers]]
id = "rei"
name = "REI"
country = "US"
currency = "USD"
url = "https://www.rei.com"
adapter = "rei"
tier = "A"
price_match = "不匹配其他店；14 天内 REI 自己降价可补差价"
price_match_ok = false   # 不接受其他店的价格匹配（只在可信度页展示政策）
detail_mode = "discounted"   # 只对打折商品调用商品接口取每个长度的价格/库存
max_detail_pages = 80

[[retailers]]
id = "christy"
name = "Christy Sports"
country = "US"
currency = "USD"
url = "https://www.christysports.com"
adapter = "christy"
tier = "A"
price_match = "宣传有价格匹配保证（具体条款未公开，下单前问客服）"
max_detail_pages = 80          # 只对打折商品抓商品页取长度/库存，按折扣从大到小
page_size = 150
categories = [
  { path = "/ski/skis/" },
  { path = "/mens/mens-ski/skis/", gender = "men" },
  { path = "/womens/womens-ski/skis/", gender = "women" },
  { path = "/kids/kids-ski-and-snowboard/skis/", gender = "kids" },
  { path = "/more-activities/backcountry/at-skis/", type = "touring" },
]

[[retailers]]
id = "thehouse"
name = "The House"
country = "US"
currency = "USD"
url = "https://www.the-house.com"
adapter = "thehouse"
tier = "caution"
# 默认停用，两个原因（2026-09 核查）：
#  1. 可信度：The House 的原公司 2023 年已被母公司 Camping World 清算，明尼苏达门店和仓库关闭；
#     现在网站由 Camping World 旗下公司运营，BBB 3 年内 1,025 条投诉、Trustpilot 2.6 分。
#  2. 抓取方式：商品列表只存在于它网页调用的 Algolia 搜索服务里（每次抓取 1 个请求，用网页里公开的只读 key），
#     它的 robots.txt 禁止抓取自己域名下的 /search 路径——严格说不适用于 Algolia 的域名，但属于灰色地带。
# 如果你仍想看它的价格，把下面改成 enabled = true。
enabled = false
max_detail_pages = 80
listing_source = "algolia"
categories = [ { path = "/skis" }, { path = "/ski-packages" } ]

