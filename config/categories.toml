# ---- Christy Sports（adapter = "christy"）：双板以外的分类。双板的配置在 retailers.toml。
# 每张表都要写 categories 和 max_detail_pages，否则会继承零售商级（双板）的值。
# categories：分类页列表（gender = 该页代表的性别，type = 类型线索，include / exclude = 只对该页生效的过滤正则）
# include / exclude（表级）：对该分类所有页生效；匹配文本是 "Christy 商品分类 | 品类 | 部门 | 标题"，不区分大小写。
# 没有 protection（护具）：Christy 没有雪上护具分类页（只有自行车护具）。

[christy.binding]    # 固定器
max_detail_pages = 15
exclude = "snowboard|splitboard"
categories = [
  { path = "/ski/bindings/" },
  { path = "/mens/mens-ski/ski-bindings/", gender = "men" },
  { path = "/womens/womens-ski/ski-bindings/", gender = "women" },
  { path = "/kids/kids-ski-and-snowboard/ski-bindings/", gender = "kids" },
  { path = "/more-activities/backcountry/at-bindings/", type = "touring" },
]

[christy.boot]    # 雪鞋
max_detail_pages = 45
exclude = "snowboard|splitboard|insoles?|footbeds?"
categories = [
  { path = "/ski/boots/" },
  { path = "/mens/mens-ski/ski-boots/", gender = "men" },
  { path = "/womens/womens-ski/ski-boots/", gender = "women" },
  { path = "/kids/kids-ski-and-snowboard/ski-boots/", gender = "kids" },
  { path = "/more-activities/backcountry/at-boots/", type = "touring" },
]

[christy.pole]    # 雪杖
max_detail_pages = 8
exclude = "trekking|hiking|nordic"
categories = [
  { path = "/ski/poles/" },
  { path = "/more-activities/backcountry/poles/", type = "touring" },
]

[christy.helmet]    # 头盔
max_detail_pages = 10
exclude = '\bbike\b|cycling'
categories = [
  { path = "/ski/helmets/" },
  { path = "/mens/mens-gear/helmets/", gender = "men" },
  { path = "/womens/womens-gear/helmets/", gender = "women" },
  { path = "/kids/kids-gear/helmets/", gender = "kids" },
]

[christy.goggle]    # 雪镜
max_detail_pages = 0
categories = [
  { path = "/ski/goggles/" },
  { path = "/mens/mens-gear/goggles/", gender = "men" },
  { path = "/womens/womens-gear/goggles/", gender = "women" },
  { path = "/kids/kids-gear/goggles/", gender = "kids" },
]

[christy.jacket]    # 雪服
max_detail_pages = 25
exclude = '(?:\bsuits?\b|snow ?suit|one[- ]?piece|\bonesie\b|jumpsuit|coverall)[^|]*$|baselayer|base layer|half[- ]zip|t-neck'
categories = [
  { path = "/mens/mens-clothing/snow-jackets/", gender = "men" },
  { path = "/womens/womens-clothing/snow-jackets/", gender = "women" },
  { path = "/kids/kids-clothing/snow-jackets/", gender = "kids" },
]

[christy.pants]    # 雪裤/背带裤
max_detail_pages = 25
exclude = '(?:\bsuits?\b|snow ?suit|one[- ]?piece|\bonesie\b|jumpsuit|coverall)[^|]*$|baselayer|base layer'
categories = [
  { path = "/mens/mens-clothing/snow-pants/", gender = "men" },
  { path = "/womens/womens-clothing/snow-pants/", gender = "women" },
  { path = "/kids/kids-clothing/snow-pants/", gender = "kids" },
]

[christy.suit]    # 连体服
max_detail_pages = 5
include = '(?:\bsuits?\b|snow ?suit|one[- ]?piece|\bonesie\b|jumpsuit|coverall)[^|]*$'
categories = [
  { path = "/womens/womens-clothing/snowsuits/", gender = "women" },
  { path = "/kids/kids-clothing/snow-jackets/", gender = "kids" },
  { path = "/kids/kids-clothing/snow-pants/", gender = "kids" },
]

[christy.midlayer]    # 中间层
max_detail_pages = 20
exclude = 'baselayer|base layer|underwear|logo|^(?!.*(?:fleece|half[- ]zip|quarter[- ]zip|1/4|¼|pullover|vest|hood(?:ie|y)?|insulated|puff|down\b)).*(?:l/s/casual|s/s casual|fashion/casual)'
categories = [
  { path = "/mens/mens-clothing/layers-and-insulation/", gender = "men" },
  { path = "/womens/womens-clothing/layers-and-insulation/", gender = "women" },
  { path = "/kids/kids-clothing/layers-and-insulation/", gender = "kids" },
]

[christy.baselayer]    # 保暖内衣
max_detail_pages = 15
include = "baselayer|base layer|underwear"
categories = [
  { path = "/mens/mens-clothing/layers-and-insulation/", gender = "men" },
  { path = "/womens/womens-clothing/layers-and-insulation/", gender = "women" },
  { path = "/kids/kids-clothing/layers-and-insulation/", gender = "kids" },
]

[christy.glove]    # 手套
max_detail_pages = 20
exclude = '\bbike\b|cycling|golf|tennis'
categories = [
  { path = "/accessories/gloves-and-mittens/" },
  { path = "/mens/mens-gear/gloves-and-mittens/", gender = "men" },
  { path = "/womens/womens-gear/gloves-and-mittens/", gender = "women" },
  { path = "/kids/kids-gear/gloves-and-mittens/", gender = "kids" },
]

[christy.sock]    # 滑雪袜
max_detail_pages = 5
include = '\bski\b|snow|heat'
categories = [
  { path = "/accessories/socks/" },
  { path = "/mens/mens-clothing/socks/", gender = "men" },
  { path = "/womens/womens-clothing/socks/", gender = "women" },
  { path = "/kids/kids-clothing/socks/", gender = "kids" },
]

[christy.facewear]    # 护脸/围脖
max_detail_pages = 0
categories = [
  { path = "/accessories/masks-and-neck-gaiters/" },
  { path = "/mens/mens-gear/masks-and-neck-gaiters/", gender = "men" },
  { path = "/womens/womens-gear/masks-and-neck-gaiters/", gender = "women" },
  { path = "/kids/kids-gear/masks-and-neck-gaiters/", gender = "kids" },
]

[christy.hat]    # 帽子
max_detail_pages = 0
exclude = "trucker|ball caps|sun/performance|tennis"
categories = [
  { path = "/accessories/hats-and-beanies/" },
  { path = "/mens/mens-gear/hats-and-beanies/", gender = "men" },
  { path = "/womens/womens-gear/hats-and-beanies/", gender = "women" },
  { path = "/kids/kids-gear/hats-and-beanies/", gender = "kids" },
]

[christy.backpack]    # 背包
max_detail_pages = 0
categories = [
  { path = "/more-activities/backcountry/backpacks/", type = "touring" },
  { path = "/ski/bagsand-packs-and-travel/", include = "a/t bags|day packs|hydration" },
]

[christy.bag]    # 雪板包/雪鞋包
max_detail_pages = 0
exclude = "a/t bags|day packs|hydration|snowboard bags"
categories = [
  { path = "/ski/bagsand-packs-and-travel/" },
]

[christy.avalanche]    # 雪崩装备
max_detail_pages = 0
categories = [
  { path = "/more-activities/backcountry/beaconsand-probes-and-shovels/" },
]

[christy.skin]    # 止滑带
max_detail_pages = 5
exclude = "splitboard"
categories = [
  { path = "/more-activities/backcountry/skins/" },
]

[christy.tuning]    # 打蜡工具
max_detail_pages = 0
include = 'tools|\bwax|tun|edge|\bfile|brush|scraper|iron|vise|sharpen|stone'
exclude = "snowboard"
categories = [
  { path = "/ski/tuning-equipment/" },
  { path = "/accessories/tuning/" },
]

[christy.accessory]    # 其他配件
max_detail_pages = 0
exclude = 'gloves|mittens|\bmitts\b|socks|vests|boot bags|beacon|transceiver|\bprobes?\b|shovel|\bskins\b|balaclava|gaiter|beanie|goggles|helmet'
categories = [
  { path = "/ski/accessories/" },
  { path = "/accessories/warmers-and-electronic-heating/" },
  { path = "/more-activities/backcountry/accessories/", type = "touring" },
]


