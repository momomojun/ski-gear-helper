# ============================================================================ Tactics（skideals/adapters/tactics.py）
# 不带前缀的分类页是男款（面包屑 “Men's Snowboard Clothing”），womens-* 是女款；童装页是混装的（放在雪服下，按标题改判）。
[tactics.ski]
enabled = false

