[blackdiamond.skin]
collections = ["climbing-skins"]

# ================================================================ 非 Shopify 网站
# ---- REI（adapter = "rei"）：双板以外的分类。双板的配置在 retailers.toml。
# 零售商级别的键会合并进每个分类，所以每张表都显式写 category_paths（可为空列表）、gender_paths（可为 {}）和 max_detail_pages。
# 没有主列表时（category_paths = []），性别子分类的并集就是全部商品；同时出现在 men 和 women 列表里的 = unisex。
# REI 不卖护具（protection）。中间层用它的抓绒外套 + 保暖外套分类（通用户外分类，但就是滑雪穿的中间层）。

[rei.binding]
category_paths = ["/c/downhill-ski-bindings", "/c/alpine-touring-ski-bindings"]
gender_paths = {}
max_detail_pages = 15

[rei.boot]
category_paths = []
max_detail_pages = 30
[rei.boot.gender_paths]
men = ["/c/mens-downhill-ski-boots", "/c/mens-alpine-touring-ski-boots"]
women = ["/c/womens-downhill-ski-boots", "/c/womens-alpine-touring-ski-boots"]
kids = "/c/kids-downhill-ski-boots"

[rei.pole]
category_paths = ["/c/backcountry-ski-poles"]
max_detail_pages = 8
[rei.pole.gender_paths]
men = "/c/mens-ski-poles"
women = "/c/womens-ski-poles"
kids = "/c/kids-ski-poles"

[rei.helmet]
category_paths = []
max_detail_pages = 12
[rei.helmet.gender_paths]
men = "/c/mens-snowsports-helmets"
women = "/c/womens-snowsports-helmets"
kids = "/c/kids-snowsports-helmets"

[rei.goggle]
category_paths = []
max_detail_pages = 15
[rei.goggle.gender_paths]
men = "/c/mens-snowsports-goggles"
women = "/c/womens-snowsports-goggles"
kids = "/c/kids-snowsports-goggles"

[rei.jacket]
category_paths = []
exclude_paths = ["/c/cross-country-ski-jackets"]
max_detail_pages = 30
[rei.jacket.gender_paths]
men = "/c/mens-ski-jackets"
women = "/c/womens-ski-jackets"
kids = "/c/kids-ski-jackets"

[rei.pants]
category_paths = []
exclude_paths = ["/c/cross-country-ski-pants"]
max_detail_pages = 25
[rei.pants.gender_paths]
men = "/c/mens-ski-pants"
women = "/c/womens-ski-pants"
kids = "/c/kids-ski-pants"

[rei.suit]
category_paths = []
max_detail_pages = 5
[rei.suit.gender_paths]
women = "/c/womens-snowsuits"
kids = ["/c/kids-snowsuits", "/c/kids-buntings"]

[rei.midlayer]
# 抓绒外套 + 保暖（羽绒/棉）外套：不是滑雪专用分类，但就是滑雪穿的中间层（雪服里面那一层）
category_paths = []
max_detail_pages = 20
[rei.midlayer.gender_paths]
men = ["/c/mens-fleece-jackets", "/c/mens-insulated-jackets"]
women = ["/c/womens-fleece-jackets", "/c/womens-insulated-jackets"]
kids = ["/c/kids-fleece-jackets", "/c/kids-insulated-jackets"]

[rei.baselayer]
category_paths = []
max_detail_pages = 12
[rei.baselayer.gender_paths]
men = "/c/mens-base-layers"
women = "/c/womens-base-layers"
kids = "/c/kids-base-layers"

[rei.glove]
category_paths = []
max_detail_pages = 15
[rei.glove.gender_paths]
men = "/c/mens-ski-gloves-and-mittens"
women = "/c/womens-ski-gloves-and-mittens"
kids = "/c/kids-ski-gloves-and-mittens"

[rei.sock]
category_paths = []
max_detail_pages = 8
[rei.sock.gender_paths]
men = "/c/mens-ski-socks"
women = "/c/womens-ski-socks"
kids = "/c/kids-ski-socks"

[rei.facewear]
category_paths = []
max_detail_pages = 8
[rei.facewear.gender_paths]
men = ["/c/mens-neck-gaiters", "/c/mens-balaclavas"]
women = ["/c/womens-neck-gaiters", "/c/womens-balaclavas"]
kids = ["/c/kids-neck-gaiters", "/c/kids-balaclavas"]

[rei.hat]
category_paths = []
max_detail_pages = 8
[rei.hat.gender_paths]
men = ["/c/mens-beanies", "/c/mens-snow-headbands"]
women = ["/c/womens-beanies", "/c/womens-snow-headbands"]
kids = "/c/kids-beanies"

[rei.backpack]
category_paths = ["/c/ski-backpacks"]
max_detail_pages = 8
[rei.backpack.gender_paths]
women = "/c/ski-backpacks/f/g-womens"

[rei.bag]
category_paths = ["/c/ski-bags", "/c/ski-boot-bags", "/c/ski-gear-bags"]
gender_paths = {}
max_detail_pages = 5

[rei.avalanche]
category_paths = ["/c/avalanche-safety-gear"]
gender_paths = {}
max_detail_pages = 8

[rei.skin]
category_paths = ["/c/climbing-skins"]
exclude_paths = ["/c/ski-crampons"]
gender_paths = {}
max_detail_pages = 5

[rei.tuning]
category_paths = ["/c/ski-tuning-and-tools"]
gender_paths = {}
max_detail_pages = 5

[rei.accessory]
category_paths = ["/c/boot-accessories", "/c/boot-dryers", "/c/hand-and-foot-warmers", "/c/goggle-accessories", "/c/snowsports-helmet-accessories", "/c/ski-carriers", "/c/ski-binding-accessories", "/c/ski-crampons", "/c/ski-locks"]
gender_paths = {}
max_detail_pages = 5

