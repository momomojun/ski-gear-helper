# ============================================================================
# 独立 outdoor 专区；固定分类由 categories/normalize 注册，滑雪配置和默认首页不变。
# 2026-10-18 少量 Fetcher probe（robots/2s 限速，无 DB）：以下所有路径均返回真实商品。
# REI：男女分类逐个核实，列表 /c/<handle>?pagesize=30&sort=title&json=true。
# 详情 /rest/products/201989 已核实 size="7 Wide"、color、sku、price、isAvailable；
# sizechart.valueTable 的 U.S. Men's 为原码 identity row。仅逐商品有明确证据才传 shoe_size_system。
# all 包括原价款，单分类最多 30 个详情；余下保留搜索索引的 size/colour 关联，价格区间不伪装逐码价格。
[rei.outdoor_jacket]
category_paths = []
gender_paths = { men = "/c/mens-rain-jackets", women = "/c/womens-rain-jackets" }
exclude_paths = []
detail_mode = "all"
max_detail_pages = 30

[rei.outdoor_pants]
category_paths = []
gender_paths = { men = "/c/mens-hiking-pants", women = "/c/womens-hiking-pants" }
exclude_paths = []
detail_mode = "all"
max_detail_pages = 30

[rei.outdoor_top]
category_paths = []
gender_paths = { men = "/c/mens-hiking-shirts", women = "/c/womens-hiking-shirts" }
exclude_paths = []
detail_mode = "all"
max_detail_pages = 30

[rei.hiking_shoe]
category_paths = []
gender_paths = { men = "/c/mens-hiking-shoes", women = "/c/womens-hiking-shoes" }
exclude_paths = []
detail_mode = "all"
max_detail_pages = 30

[rei.trail_shoe]
