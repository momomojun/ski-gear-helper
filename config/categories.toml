# ---- 2026-10-26 新增 / 补充分类

[runningwarehouse.ski]
enabled = false

# Running Warehouse：列表页一页就是全部（男 306 / 女 274 个颜色卡片，中性款两边都有）；尺码只在商品页，
# max_detail_pages 控制每次抓多少个商品页（打折幅度大的优先），其余商品只有价格、没有尺码。
# 网站没有单独的徒步鞋 / 户外服装列表（导航只有 Trail Running / Walking），所以只配越野跑鞋。
[runningwarehouse.trail_shoe]
pages = [{ path = "/trailshoesmen.html", gender = "men" }, { path = "/trailshoeswomen.html", gender = "women" }]
max_detail_pages = 80

[topo.ski]
enabled = false

# Topo：接口按 custitem_collection / custitem_bestfor_activity 本地筛选（/activity/ 筛选页 robots 禁止）。
# 网站没写尺码码制；确认要当 US 处理时加 shoe_size_system = "US"。
[topo.trail_shoe]
shoe_size_system = "US"   # 美国品牌官网，尺码就是美码（网站没明写）
pages = [{ path = "/men/mens-shoes", gender = "men" }, { path = "/women/womens-shoes", gender = "women" }]
collections = ["Trail"]
activities = ["Trail Running"]

[topo.hiking_shoe]
shoe_size_system = "US"   # 美国品牌官网，尺码就是美码（网站没明写）
pages = [{ path = "/men/mens-shoes", gender = "men" }, { path = "/women/womens-shoes", gender = "women" }]
collections = ["Trail"]
activities = ["Hiking"]
exclude_activities = ["Trail Running"]

[danner.ski]
enabled = false

# Danner：Hike 分类里混有打猎款（Mossy Oak 等迷彩），用 exclude_title 去掉。网站没写 US，同 Topo。
[danner.hiking_shoe]
shoe_size_system = "US"   # 美国品牌官网，尺码就是美码（网站没明写）
pages = [{ category_id = 498, gender = "men", name = "men/hike" }, { category_id = 509, gender = "women", name = "women/hike" }]
exclude_title = "Mossy Oak|Realtree|Kryptek|Optifade"

