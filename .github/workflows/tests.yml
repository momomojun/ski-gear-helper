name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 主要用户在 Windows（start.bat），所以在 Windows 上跑单元测试；联网测试（tests/live_*.py）不在这里跑
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
