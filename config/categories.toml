[evo.helmet]
collections = ["ski-helmets"]

[evo.goggle]
collections = ["ski-goggles"]

[evo.protection]
collections = ["body-armor", "ski-body-armor", "ski-wrist-guards"]

[evo.jacket]
collections = ["ski-jackets"]

[evo.pants]
collections = ["ski-pants-bibs"]

[evo.suit]
collections = ["one-piece-snowsuits"]

[evo.midlayer]
collections = ["ski-mid-layers"]

[evo.baselayer]
collections = ["base-layers"]

[evo.glove]
collections = ["gloves-mittens"]

[evo.sock]
collections = ["ski-socks"]

[evo.facewear]
collections = ["ski-face-masks", "face-masks", "neck-warmers"]

[evo.hat]
collections = ["ski-hats-beanies"]

[evo.backpack]
collections = ["ski-backpacks", "backcountry-ski-backpacks", "avalanche-airbags"]

[evo.bag]
collections = ["ski-bags", "ski-travel-bags", "ski-boot-bags", "evo-ski-bags", "db-equipment-ski-bags", "water-ski-bags-cases"]

[evo.avalanche]
collections = ["avalanche-shovels", "avalanche-probes", "avalanche-beacons"]

[evo.skin]
collections = ["backcountry-climbing-skins", "backcountry-ski-climbing-skins"]

[evo.tuning]
collections = ["ski-wax", "ski-tuning-tools", "sidecut-tuning", "spiral-wax-co", "beaver-wax", "wax-london"]

[evo.accessory]
