# ============================================================================
# 每家店“双板以外各分类”的抓取配置：[<零售商id>.<分类>]
# Shopify 店铺：collections = 抓取的分类页；hints = 只用来标注性别的分类页
# 由 `python -m skideals discover <店铺网址>` 自动生成后人工调整：
#   · evo 的服装标题自带 Men's/Women's/Kids'，不额外抓性别分类（省约 150 个请求）
#   · 综合户外店（gearx/sportsbasement/ems/blackdiamond）的雪服、雪裤只用带 ski/snow 的分类，避免混进雨衣
# 某家店不抓双板：[<零售商id>.ski] enabled = false
# 非 Shopify 网站（REI、Christy、Peter Glenn、Sun & Ski、Skis.com）的分类配置在文件末尾
# ============================================================================

# ---------------------------------------------------------------- evo
